name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.5.1-stable

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
      - name: Import project
        run: ./godot --headless --path . --import
      - name: Run tests
        run: ./godot --headless --path . --script res://tests/run_tests.gd
      - name: Smoke run
        run: ./godot --headless --path . -- --smoke

  android:
    # APK build is switched off for now; remove the next line to turn it back on
    if: false
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
      - name: Cache Android export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-android-templates-${{ env.GODOT_VERSION }}
      - name: Download Android export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz "templates/android_*" "templates/version.txt"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && mv templates/* "$dest/" && rm -rf templates templates.tpz
      - name: Configure Android export
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
      - name: Import project
        run: ./godot --headless --path . --import
      - name: Export APK
        run: |
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/lili-a-hrom.apk
          test -s build/lili-a-hrom.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lili-a-hrom-${{ github.run_number }}
          path: build/lili-a-hrom.apk
