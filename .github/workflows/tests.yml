name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.5.1-stable_linux.x86_64 godot
      - name: Import project
        run: ./godot --headless --path . --import
      - name: Run tests
        run: ./godot --headless --path . --script res://tests/run_tests.gd
      - name: Smoke run
        run: ./godot --headless --path . -- --smoke
